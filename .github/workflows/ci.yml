name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin to the same version as local dev to keep results identical
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - run: flutter pub get

      - run: flutter analyze
